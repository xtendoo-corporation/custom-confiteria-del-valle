[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "node_modules",
  "build",
  "dist",
  "migrations",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "C4",
  "SIM",
]
ignore = [
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = """
-ra
--strict-markers
--strict-config
--cov=.
--cov-report=term-missing
--cov-report=xml
--cov-fail-under=90
"""
testpaths = [
  "tests",
]
python_files = [
  "test_*.py",
  "*_test.py",
]
python_classes = [
  "Test*",
]
python_functions = [
  "test_*",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "*/migrations/*",
  "*/__init__.py",
  "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
precision = 2

[tool.coverage.xml]
output = "coverage.xml"
